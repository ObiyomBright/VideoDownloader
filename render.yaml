services:
  - type: web
    name: videodownloader-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MAX_CONCURRENT_JOBS
        value: 2
      - key: CORS_ORIGINS
        value: "*"
      - key: PROXY_URL
        sync: false
      - key: YOUTUBE_COOKIES_TEXT
        sync: false
      - key: YOUTUBE_PO_TOKEN_SPEC
        sync: false
      - key: YOUTUBE_VISITOR_DATA
        sync: false
